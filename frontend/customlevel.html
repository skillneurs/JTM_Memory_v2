<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeu Memory</title>
    <link rel="stylesheet" href="./css/customlevel.css" />
    <link rel="stylesheet" href="./css/font.css">
</head>

<body>
    <header>
        <h1>Jeu Memory</h1>
    </header>

    <a class="home" href="../frontend/index.html">
        <span class="btn-home">Home</span>
        <img class="img-home" src="img/Home-removebg.png" alt="">
    </a>

    <div id="pair-controls">
        <button id="decrease-pairs"><svg class="svg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14" />
            </svg>

        </button>
        <div id="pair_count_div">
            <span id="pair-count"></span>
            
        </div>

        <button id="increase-pairs"><svg class="svg" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
            </svg></button>

    </div>
    <div>
        <button id="decrease-pair-size">-1</button>
        <span id="pair-size">0</span>
        <button id="increase-pair-size">+1</button>
    </div>
    
    <span id="pair-count2"></span>
    <button id="play-button">Play</button>
    <section class="cartes_container"></section>
    <script src="./javascript/customlevel.js"></script>
</body>

</html>
